<script>
'use strict';
/* ===== 태블릿 두 번 터치 확대·두 손가락 확대 막기 ===== */
(function(){
  const isInput=t=>t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA');
  let lastEnd=0;
  document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastEnd<400&&!isInput(e.target)){e.preventDefault();const el=e.target.closest&&e.target.closest('button,.bt,.op,a');if(el&&!el.disabled)el.click();}lastEnd=now;},{passive:false});
  document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
  document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault();},{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
  document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
})();
/* ============ 기본 ============ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hex=h=>[parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255];
const mixc=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
function hash2(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
function vnoise(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);return lerp(lerp(hash2(ix,iy),hash2(ix+1,iy),u),lerp(hash2(ix,iy+1),hash2(ix+1,iy+1),u),v);}
const U=40; // 픽셀 → 3D 단위
/* ============ 오디오 ============ */
let AC=null,master,musicG,sfxG,noiseBuf,muted=false;
function initAudio(){
  if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return}
  master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
  musicG=AC.createGain();musicG.gain.value=.55;musicG.connect(master);
  sfxG=AC.createGain();sfxG.gain.value=.9;sfxG.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function tone(f,t0,dur,type='sine',vol=.1,dest,att=.006,fEnd){
  if(!AC)return;dest=dest||sfxG;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(fEnd)o.frequency.exponentialRampToValueAtTime(fEnd,t0+dur);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+att);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(dest);o.start(t0);o.stop(t0+dur+.05);
}
function noise(t0,dur,vol,ft,freq,q=1,dest){
  if(!AC)return;dest=dest||sfxG;const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=ft;f.frequency.value=freq;f.Q.value=q;
  const g=AC.createGain();g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(dest);s.start(t0,Math.random());s.stop(t0+dur+.05);
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function sfx(k){

function swingA(a){
  if(!a)return .35;const p=clamp(a.t/a.dur,0,1);
  if(a.kind==='craft'){const ph=(a.t*3.3)%1;return ph<.5?-.6+ph*2*2.0:1.4-(ph-.5)*2*2.0;}
  if(a.kind==='dipper')return p<.5?.35+p*2*1.5:1.85-(p-.5)*2*1.5;
  if(a.kind==='hand')return .35+Math.sin(p*Math.PI)*1.2;
  return p<.45?.35-p/.45*1.2:p<.6?-.85+(p-.45)/.15*2.6:1.75-(p-.6)/.4*1.4;
}

function drawPlayer(o){
  const h=groundH(S.map,o.x,o.y);
  const bob=o.moving?Math.abs(Math.sin(o.walkT*11))*.06:0,sw=o.moving?Math.sin(o.walkT*11)*.6:0;
  const B=C(Tm(o.x/U,h+bob,o.y/U),RY(o.ang),Sm(o.scale||1));
  const a=o.action,tk=a?(a.kind==='craft'?'hammer':a.kind):null;
  const bend=a&&(a.kind==='dipper'||a.kind==='hand')?Math.sin(clamp(a.t/a.dur,0,1)*Math.PI)*.45:0;
  [-1,1].forEach(s=>{const L=C(B,Tm(s*.12,.38,0),RX(s*sw));draw(MS.cyl,C(L,Tm(0,-.3,0),Sm(.075,.3,.075)),SKIN);draw(MS.sph,C(L,Tm(0,-.3,.04),Sm(.1,.07,.14)),hex('#7a5236'));});

  draw(MS.cylT,C(U_,Tm(0,.34,0),Sm(.27,.42,.24)),hex('#ffb74d'));
  draw(MS.cyl,C(U_,Tm(0,.3,0),Sm(.29,.15,.26)),hex('#5b8fd6'));
  draw(MS.box,C(U_,Tm(0,.62,.2),Sm(.16,.08,.05)),[1,1,1]);
  draw(MS.sph,C(U_,Tm(-.31,.62,0),RX(-sw*.7),Tm(0,-.08,0),Sm(.09)),SKIN);
  const G=C(U_,Tm(.31,.6,.06),RX(tk&&tk!=='hand'?swingA(a):(a?swingA(a):sw*.7)));
  draw(MS.sph,C(G,Sm(.09)),SKIN);
  if(tk&&tk!=='hand')drawToolM(G,tk);
  const H=C(U_,Tm(0,1.12,0));
  draw(MS.sph,C(H,Sm(.42,.4,.4)),SKIN);
  draw(MS.hemi,C(H,Tm(0,.02,-.02),RX(-.38),Sm(.45,.44,.45)),HAIR);
  draw(MS.sph,C(H,Tm(0,.22,.28),RX(.4),Sm(.32,.12,.14)),HAIR);

}

    case 'limit':c.beginPath();c.moveTo(32,6);c.lineTo(60,56);c.lineTo(4,56);c.closePath();F('#ffd23f','#e0a020',4);rr(c,29,20,6,22,3);c.fillStyle='#6b5434';c.fill();circ(c,32,48,3.5);c.fill();break;

function polyD(x,y,paths){let d=1e9;paths.forEach(p=>{for(let i=1;i<p.length;i++)d=Math.min(d,segD(x,y,p[i-1],p[i]));});return d;}

function isleD(x,y){const dx=(x-1000)/960,dy=(y-740)/690;const th=Math.atan2(dy,dx);const r=1+.05*Math.sin(3*th+1)+.035*Math.sin(5*th);return Math.hypot(dx,dy)/r;}

function buildGround(g,x0,x1,y0,y1,step,hf,cf,cliffC){
  const nx=Math.round((x1-x0)/step),ny=Math.round((y1-y0)/step);const V=[];
  for(let j=0;j<=ny;j++){V[j]=[];for(let i=0;i<=nx;i++){const x=x0+i*step,y=y0+j*step,h=hf(x,y);V[j][i]={p:[x/U,h,y/U],c:cf(x,y,h)};}}
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
    const a=V[j][i],b=V[j][i+1],c=V[j+1][i+1],d=V[j+1][i];

  if(S.map==='village'&&S.stage==='prologue'&&S.letter)return{x:DOCKV.x,y:DOCKV.y1-40,h:1.4};

    if(S.chiefDone)return{x:DOCKI.x,y:DOCKI.y1-40,h:1.4};

    if(S.stage==='install')SITES.forEach(s=>{if(s.pond){const dx=(P.x-POND.x)/(POND.rx+75),dy=(P.y-POND.y)/(POND.ry+65),e=Math.hypot(dx,dy);if(e<1)L.push({type:'site',s,x:P.x,y:P.y,r:999,near:true,dd:(e-.7)*200,h:2,label:instAt(s.id)?'발전기 살펴보기':'후보지 살펴보기',px:s.x,py:s.y});return}
      L.push({type:'site',s,x:s.x,y:s.y,r:80,h:2.2+Math.max(0,hVil(s.x,s.y)),label:instAt(s.id)?'발전기 살펴보기':'후보지 살펴보기'});});
    if(S.stage==='prologue'&&S.letter)L.push({type:'boat',x:DOCKV.x,y:DOCKV.y1-50,r:90,h:1.6,label:'배 타기'});
  }else{

function nearest(){let best=null,bd=1e9;interactables().forEach(o=>{const d=o.near?o.dd:Math.hypot(o.x-P.x,(o.y-P.y)*1.2);if(d<o.r&&d<bd){bd=d;best=o;}});return best;}
function faceTo(x,y){P.ang=Math.atan2(x-P.x,y-P.y);}
const MODALS=['note','book','inst','exp','res','hDet','quiz','pass'];
function busy(){return !!DLG||!!CHO||S.lock||S.trans||!!P.action||MODALS.some(id=>!$(id).classList.contains('hidden'));}
function onA(){
  if(S.mode==='title')return;
  if(!$('book').classList.contains('hidden'))return;

function josa(w,a,b){const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+b;return w+(((c-0xAC00)%28)?a:b);}

function weekUpdate(dt){
  if(!SIM)return;
  if(SIM.shown!==SIM.day){SIM.shown=SIM.day;const d=S.week[SIM.day],r=genDay(S.inst,d);SIM.res[SIM.day]=r;renderWk();updateHUD();
    const cap=$('caption');cap.innerHTML=`<b>${SIM.day+1}일째</b> · ${WX.sky[d.sky][1]} ${WX.sky[d.sky][0]} · ${WX.wind[d.wind][0]} · ${WX.sea[d.sea][0]} · ${WX.water[d.water][0]}<br><span class="say">${VILL[d.who].name}: “${d.say}”</span>`;cap.style.opacity=1;

}
function dayReason(d,inst,good){const has=t=>inst.some(g=>g.t===t);const R=[];
  if(good){if(has('solar')&&d.sky==='sun')R.push('햇빛이 쨍쨍했어요');if(has('wind')&&(d.wind==='strong'||d.wind==='mid'))R.push(d.wind==='strong'?'바람이 세게 불었어요':'바람이 알맞게 불었어요');if(has('hydro')&&d.water==='much')R.push('폭포 물이 많았어요');if(has('tidal')&&d.sea==='strong')R.push('바닷물 흐름이 셌어요');}
  else{if(has('wind')&&d.wind==='storm')R.push('태풍이라 풍력 발전기가 멈췄어요');else if(has('wind')&&(d.wind==='none'||d.wind==='light'))R.push(d.wind==='none'?'바람이 하나도 없었어요':'바람이 약했어요');if(has('solar')&&d.sky!=='sun')R.push(d.sky==='cloud'?'구름이 껴서 햇빛이 약했어요':d.sky==='rain'?'비가 와서 햇빛이 거의 없었어요':'햇빛도 거의 없었어요');if(has('tidal')&&d.sea==='weak')R.push('바닷물 흐름이 약했어요');if(has('hydro')&&d.water==='dry')R.push('폭포 물이 적었어요');}
  if(!R.length)R.push(good?'날씨가 고르게 좋았어요':'날씨가 크게 바뀌지 않는 발전기가 적었어요');return R.slice(0,2).join(', ');}
function endWeek(){
  const res=S.week.map(d=>genDay(S.inst,d)),avg=res.reduce((s,r)=>s+r.ratio,0)/7;let hi=0,lo=0;res.forEach((r,i)=>{if(r.ratio>res[hi].ratio)hi=i;if(r.ratio<res[lo].ratio)lo=i;});
  const out={avg,hi,lo,min:res[lo].ratio,cost:spent(),inst:S.inst.map(g=>({t:g.t,site:g.site})),mode:S.weekMode,days:res.map(r=>pct(r.ratio))};

    const dx=(x-POND.x)/(POND.rx+r*.6),dy=(y-POND.y)/(POND.ry+r*.5);if(dx*dx+dy*dy<1)return true;
    const px=(x-POOLV.x)/(POOLV.rx+r),py=(y-POOLV.y)/(POOLV.ry+r);if(px*px+py*py<1)return true;

  }else{
    if(isleD(x,y)>.965&&!onPier('isle',x,y))return true;if(onPier('isle',x,y)&&(Math.abs(x-DOCKI.x)>34||y>DOCKI.y1-12))return true;
    if(y-r*.6<plateY(x))return true;
    if(Math.abs(x-1000)<120+r&&y>230&&y<380+r*.4)return true;
    for(const h of [{x:1300,y:560},{x:1420,y:1000},{x:560,y:1000}])if(x>h.x-66-r&&x<h.x+66+r&&y>h.y-90&&y<h.y+4+r*.4)return true;
    if(Math.abs(x-600)<55+r&&y>1060&&y<1158+r*.4)return true;
    if(Math.hypot(x-760,(y-1120)*1.3)<44+r)return true;
    if(y>1288&&y<1312&&x>460&&x<905)return true;
    const px=(x-POOLI.x)/(POOLI.rx+r),py=(y-POOLI.y)/(POOLI.ry+r);if(px*px+py*py<1)return true;

  }

    if(Math.random()<dt*2)part(X/U+(Math.random()-.5)*.8,h+1.4,Y/U,0,.6,0,'#ffffff',.06,1.2,true);}

function bubble(c,x,y,t){const b=Math.sin(T*6)*3;c.save();c.translate(x,y+b);rr(c,-16,-36,32,32,12);c.fillStyle='#fff';c.fill();c.beginPath();c.moveTo(-5,-5);c.lineTo(5,-5);c.lineTo(0,3);c.closePath();c.fill();c.fillStyle=t==='!'?'#ff5a3c':'#ff6f91';c.font='25px Jua, sans-serif';c.textAlign='center';c.fillText(t,0,-11);c.restore();}
function prompt(c,x,y,label){c.save();c.font='17px Jua, sans-serif';const tw=c.measureText(label).width+50;c.translate(x,y);rr(c,-tw/2,-18,tw,34,17);c.fillStyle='rgba(255,251,234,.96)';c.fill();
  circ(c,-tw/2+18,-1,12);c.fillStyle='#58b84a';c.fill();c.fillStyle='#fff';c.textAlign='center';c.fillText('A',-tw/2+18,5);c.fillStyle='#6b5434';c.textAlign='left';c.fillText(label,-tw/2+36,5);c.restore();}
function tag(c,x,y,txt,bg,fg='#fff'){c.font='15px Jua, sans-serif';c.textAlign='center';const tw=c.measureText(txt).width+16;rr(c,x-tw/2,y-12,tw,24,10);c.fillStyle=bg;c.fill();c.fillStyle=fg;c.fillText(txt,x,y+5);}
const ISIGNS=[[380,560,'☀️ 햇살 언덕'],[1700,640,'💨 바람 해안'],[610,420,'💧 물레 폭포'],[1500,1080,'🌊 밀물 바닷길'],[1240,560,'🔥 따끈 온돌집'],[620,1210,'🌱 꼬순 농장'],[1000,385,'🦉 마을 회관'],[1090,1480,'⛵ 부두']];
function drawOverlay(){
  const c=o2;c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,VW,VH);
  if(S.mode==='title'||S.mode==='end')return;
  const d=curWx();
  if(d.wind==='strong'||d.wind==='storm'){c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=2.5;for(let i=0;i<(d.wind==='storm'?14:8);i++){const x=((i*173)+T*(d.wind==='storm'?520:360))%(VW+200)-100,y=80+(i*97)%(VH*.6);c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+40,y-10,x+80,y);c.stroke();}}
  if(S.mode==='week')return;
  if(S.map==='isle'){ISIGNS.forEach(([x,y,t])=>{const p=proj(x/U,1.4,y/U);if(p)tag(c,p.x,p.y,t,'rgba(185,135,85,.95)','#fff6d8');});
    if(S.stage==='tour')for(const id in ISLE){const v=ISLE[id];const want=v.chief?(GORDER.every(t=>S.visited[t])&&!S.chiefDone):!S.visited[v.spot];if(want){const p=proj(v.x/U,v.chief?2.7:2.45,v.y/U);if(p)bubble(c,p.x,p.y,'!');}}}
  else{if(S.stage==='install')SITES.forEach(s=>{const g=instAt(s.id),h=Math.max(0,hVil(s.x,s.y));const p=proj(s.x/U,h+1.75,s.y/U+.2);if(!p)return;if(g)tag(c,p.x,p.y,`${s.id} · ${GEN[g.t].short}`,GEN[g.t].col);else tag(c,p.x,p.y,`⚡ ${s.id}`,'rgba(224,160,32,.95)');});
    if(S.stage==='prologue'&&!S.letter){const b=VILL.bori;const p=proj(b.x/U,2.75,b.y/U);if(p)bubble(c,p.x,p.y,'!');}
    if(S.stage==='install'){const b=VILL.bori;const p=proj(b.x/U,2.75,b.y/U);if(p&&S.inst.length)bubble(c,p.x,p.y,'♥');}}
  if(S.mode!=='play')return;
  const tgt=questTarget();
  if(tgt){const p=proj(tgt.x/U,tgt.h+.3,tgt.y/U);
    if(p){const by=p.y+Math.sin(T*5)*6;c.fillStyle='#ff9f1c';c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();c.moveTo(p.x-13,by-18);c.lineTo(p.x+13,by-18);c.lineTo(p.x,by);c.closePath();c.stroke();c.fill();}
    const m=70;if(!p||p.x<m||p.x>VW-m||p.y<m+40||p.y>VH-m){const pp=p||{x:VW/2,y:VH+200};const ax=clamp(pp.x,m,VW-m),ay=clamp(pp.y,m+90,VH-m-40),an=Math.atan2(pp.y-ay,pp.x-ax);
      c.save();c.translate(ax,ay);circ(c,0,0,26);c.fillStyle='rgba(255,251,234,.95)';c.fill();c.rotate(an);c.fillStyle='#ff9f1c';c.beginPath();c.moveTo(16,0);c.lineTo(-6,-11);c.lineTo(-2,0);c.lineTo(-6,11);c.closePath();c.fill();c.restore();}}
  if(!busy()){const t=nearest();if(t){const p=proj((t.px||t.x)/U,t.h,(t.py||t.y)/U);if(p)prompt(c,p.x,p.y-(t.type==='site'?26:0),t.label);}}
}

function loadScript(src){return new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e);});}
function classKey(sch,cl){return PREFIX+(sch.replace(/\s+/g,'')+'__'+cl.replace(/\s+/g,'')).replace(/[\/.#$\[\]]/g,'-');}
function initSync(){
  if(SYNC.ready)return SYNC.ready;
  SYNC.ready=(async()=>{if(!FIREBASE_CONFIG.apiKey)return;try{const v='10.12.2';await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`);

const stu=cls=>SYNC.db.collection(COLL).doc(cls).collection('students');
function lsGet(cls){try{return JSON.parse(localStorage.getItem('re2_class_'+cls)||'{}');}catch(e){return{};}}
function lsSet(cls,o){try{localStorage.setItem('re2_class_'+cls,JSON.stringify(o));}catch(e){}}
async function syncWrite(cls,id,data){await initSync();
  if(SYNC.mode==='firebase'){try{await stu(cls).doc(id).set(data,{merge:true});}catch(e){console.warn(e);}}
  else{const o=lsGet(cls);o[id]=Object.assign(o[id]||{},data);lsSet(cls,o);}}
async function syncGet(cls,id){await initSync();
  if(SYNC.mode==='firebase'){try{const d=await Promise.race([stu(cls).doc(id).get(),wait(3500).then(()=>null)]);return d&&d.exists?d.data():null;}catch(e){return null;}}
  return lsGet(cls)[id]||null;}
async function syncListen(cls,cb){await initSync();
  if(SYNC.mode==='firebase')return stu(cls).onSnapshot(sn=>{const a=[];sn.forEach(d=>a.push(Object.assign({id:d.id},d.data())));cb(a);},e=>console.warn(e));
  const f=()=>{const o=lsGet(cls);cb(Object.keys(o).map(k=>Object.assign({id:k},o[k])));};f();const iv=setInterval(f,1500);addEventListener('storage',f);return()=>{clearInterval(iv);removeEventListener('storage',f);};}
async function syncClear(cls){await initSync();

function hlParse(line){let txt='',mask=[],on=false;for(const ch of line){if(ch==='«'){on=true;continue}if(ch==='»'){on=false;continue}txt+=ch;mask.push(on);}return{txt,mask};}
const escH=c=>c==='<'?'&lt;':c==='>'?'&gt;':c==='&'?'&amp;':c;
function hlHTML(line,n){const p=hlParse(line);let h='',on=false;const m=Math.min(n==null?p.txt.length:n,p.txt.length);
  for(let i=0;i<m;i++){if(p.mask[i]&&!on){h+='<span class="hl">';on=true;}else if(!p.mask[i]&&on){h+='</span>';on=false;}h+=escH(p.txt[i]);}if(on)h+='</span>';return h;}
function dlgTick(dt){if(!DLG||!DLG.typing)return;const p=hlParse(DLG.lines[DLG.i]);DLG.acc+=dt*34;
  while(DLG.acc>=1&&DLG.pos<p.txt.length){DLG.acc-=1;DLG.pos++;const ch=p.txt[DLG.pos-1];if(DLG.pos%2===1&&ch.trim()&&!'.…,!?'.includes(ch))blip(DLG.sp.pitch||300);}
  $('dText').innerHTML=hlHTML(DLG.lines[DLG.i],DLG.pos);if(DLG.pos>=p.txt.length)finishLine();}
function finishLine(){DLG.typing=false;$('dText').innerHTML=hlHTML(DLG.lines[DLG.i]);if(DLG.keep&&DLG.i===DLG.lines.length-1){DLG.waitingChoice=true;DLG.res();return;}$('dNx').style.visibility='visible';}

  back:[[0,'⛵ 배운 것을 가득 안고 도토리 마을로!'],[2.4,'물결: ♪ 철썩철썩~ 집으로 가는 길~ 에너지 카드 가득 품에 안고~ ♪'],[5.6,'물결: 도토리 마을에도 바람과 햇살이 가득하길 바란단다… 천천히, 천천히.']]
};
async function sail(){
  S.trans=true;sfx('door');$('fade').style.opacity=1;await wait(650);
  const toIsle=S.map==='village';
  ['quest','ctrl'].forEach(id=>$(id).classList.add('hidden'));$('hud').classList.add('hidden');
  const prevMap=S.map;S.map='isle';SAIL={t:0,dur:8.2,toIsle,h:0};S.mode='sail';S.gloomT=0;S.gloom=toIsle?.4:0;BGM.mode='happy';
  for(let i=PARTS.length-1;i>=0;i--)PARTS.splice(i,1);
  const origPart=part;
  part=function(x,y,z,vx,vy,vz,col,size,life,float){origPart(x,y,z,vx,vy,vz,col,size,life,float);PARTS[PARTS.length-1].map=S.mode==='sail'?'sail':S.map;};
  $('toast').style.opacity=0;const clk=$('clkM').textContent;$('clkM').textContent='⛵ 바다 위';
  $('fade').style.opacity=0;const cap=$('caption');const lines=SAILCAP[toIsle?'to':'back'];
  for(let i=0;i<lines.length;i++){const nt=(lines[i+1]?lines[i+1][0]:SAIL.dur)-lines[i][0];cap.textContent=lines[i][1];cap.style.opacity=1;if(i)blip(190);await wait(nt*1000-250);cap.style.opacity=0;await wait(250);}
  $('fade').style.opacity=1;await wait(650);
  $('clkM').textContent=clk;part=origPart;S.mode='play';SAIL=null;S.map=prevMap;PARTS.length=0;
  if(toIsle){S.map='isle';S.stage='tour';P.x=1000;P.y=1380;P.ang=Math.PI;$('clkM').textContent='🌞 바람햇살 마을';BGM.mode='happy';S.gloomT=S.gloom=0;const o=ISLE.owl;o.x=1000;o.y=1300;o.ang=0;}
  else{S.map='village';S.stage='install';P.x=1000;P.y=1680;P.ang=Math.PI;$('clkM').textContent='🏡 도토리 마을';BGM.mode='sad';S.gloom=S.gloomT=.78;const b=VILL.bori;b.x=1000;b.y=1600;b.ang=0;}
  if(isTouch())$('ctrl').classList.remove('hidden');
  cam.x=P.x;cam.y=P.y;updateQuestUI();updateHUD();report(true);
  await wait(300);$('fade').style.opacity=0;await wait(500);S.trans=false;
  S.lock=true;
  if(toIsle){const o=ISLE.owl;o.frozen=true;await say(o,['어서 오게, 도토리 마을 친구! 나는 바람햇살 마을의 촌장 부엉이라네.','우리 마을에는 여섯 가지 재생 에너지 발전소가 있지.','마을 곳곳의 주민들에게 배우고, 에너지 카드 6장을 모두 모아 오게.','다 모으면 마을 회관으로 오게나. 부엉부엉!']);
    $('fade').style.opacity=1;await wait(500);o.x=o.home.x;o.y=o.home.y;o.frozen=false;$('fade').style.opacity=0;toast('🧭 주민들을 찾아가 에너지 카드를 모아요! 오른쪽 위 ⚡ 버튼으로 언제든 볼 수 있어요',4200);}
  else{const b=VILL.bori;b.frozen=true;await say(b,['{name}! 돌아왔구나, 깡총!','바람햇살 마을 촌장님이 마을 예산을 보내 주셨다고? 고마워!','마을 곳곳에 ⚡ 후보지 표지판을 세워 뒀어. 모두 10곳이야.','자리를 살펴보고, 알맞은 발전기를 골라 설치해 줘!','화면 위쪽에는 마을 전기 가운데 «재생 에너지가 몇 %»인지 보여 줄게.','목표는 «일주일 평균 50% 이상»! 다 설치하면 광장에 있는 나에게 말해 줘.']);
    b.home={x:1000,y:840};b.x=1000;b.y=840;b.frozen=false;updateHUD();toast('🔧 ⚡ 표지판에 다가가 Ⓐ를 누르면 자리를 살펴볼 수 있어요',4200);}
  S.lock=false;
}
if(gl&&MS.sea)buildBoatMesh();

</script>
